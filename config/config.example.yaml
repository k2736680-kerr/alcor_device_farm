server:
  address: "127.0.0.1:8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

# Inject the real URL through DEVICE_FARM_DATABASE_URL. An empty value keeps
# only health endpoints available and makes management APIs fail closed.
database:
  url: ""

log:
  level: info
  format: json

lease:
  scheduler_interval: 250ms
  reaper_interval: 1s
  grace_period: 30s

reconcile:
  interval: 2s
  host_timeout: 30s
  failure_threshold: 3

# The controller turns device_pool_images min_ready/max_instances targets into
# Host Commands. It never talks to Docker directly.
warm_pool:
  interval: 30s

# STF remains the remote-control and visibility tool. PostgreSQL reservations
# remain the allocation source of truth. Inject api_token through an environment
# secret instead of committing it here.
stf:
  enabled: false
  base_url: "http://127.0.0.1:7100"
  api_token: ""
  timeout: 5s
  attempts: 3
  retry_delay: 200ms

# Keep real tokens out of YAML committed to Git. Protected routes fail closed
# with 401 while the matching token is empty.
security:
  service_token: ""
  agent_token: ""
