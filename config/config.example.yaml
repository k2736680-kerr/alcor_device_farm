server:
  address: "127.0.0.1:8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

log:
  level: info
  format: json

# Keep real tokens out of YAML committed to Git. Protected routes fail closed
# with 401 while the matching token is empty.
security:
  service_token: ""
  agent_token: ""
