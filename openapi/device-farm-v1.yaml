openapi: 3.0.3
info:
  title: Alcor Device Farm API
  version: 1.2.0
  x-contract-status: frozen
  x-contract-frozen-at: 2026-08-03
  x-platform-semantics: Case/Run/RunAttempt
  description: >-
    Android 设备农场独立控制面契约。北向接口只接受平台服务身份，
    internal 接口只接受 Host Agent 身份；不包含 Alcor Run、Result 或历史评估任务接口。
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: System
  - name: Images
  - name: Hosts
  - name: Pools
  - name: Devices
  - name: Reservations
  - name: Console
  - name: Audit
  - name: Agent
security:
  - serviceBearer: []
  - consoleCookie: []
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200": {$ref: "#/components/responses/Success"}
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "503": {$ref: "#/components/responses/Error"}
  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema: {type: string}
  /api/v1/device-images:
    get:
      tags: [Images]
      operationId: listDeviceImages
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {$ref: "#/components/responses/ImageListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [Images]
      operationId: createDeviceImage
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/DeviceImageInput"}
      responses:
        "201": {$ref: "#/components/responses/ImageCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-images/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    get:
      tags: [Images]
      operationId: getDeviceImage
      responses:
        "200": {$ref: "#/components/responses/ImageSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      tags: [Images]
      operationId: updateDeviceImage
      requestBody: {$ref: "#/components/requestBodies/DeviceImageInput"}
      responses:
        "200": {$ref: "#/components/responses/ImageSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-images/{id}/validations:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Images]
      operationId: validateDeviceImage
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/ImageAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-hosts:
    get:
      tags: [Hosts]
      operationId: listDeviceHosts
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {$ref: "#/components/responses/HostListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [Hosts]
      operationId: createDeviceHost
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/DeviceHostInput"}
      responses:
        "201": {$ref: "#/components/responses/HostCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-hosts/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    get:
      tags: [Hosts]
      operationId: getDeviceHost
      responses:
        "200": {$ref: "#/components/responses/HostSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      tags: [Hosts]
      operationId: updateDeviceHost
      requestBody: {$ref: "#/components/requestBodies/DeviceHostInput"}
      responses:
        "200": {$ref: "#/components/responses/HostSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-hosts/{id}/drains:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Hosts]
      operationId: drainDeviceHost
      requestBody: {$ref: "#/components/requestBodies/OperationReason"}
      responses:
        "200": {$ref: "#/components/responses/HostSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      tags: [Hosts]
      operationId: undrainDeviceHost
      requestBody: {$ref: "#/components/requestBodies/OperationReason"}
      responses:
        "200": {$ref: "#/components/responses/HostSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-pools:
    get:
      tags: [Pools]
      operationId: listDevicePools
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {$ref: "#/components/responses/PoolListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [Pools]
      operationId: createDevicePool
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/DevicePoolInput"}
      responses:
        "201": {$ref: "#/components/responses/PoolCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-pools/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    get:
      tags: [Pools]
      operationId: getDevicePool
      responses:
        "200": {$ref: "#/components/responses/PoolSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      tags: [Pools]
      operationId: updateDevicePool
      requestBody: {$ref: "#/components/requestBodies/DevicePoolInput"}
      responses:
        "200": {$ref: "#/components/responses/PoolSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-pools/{id}/devices:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Pools]
      operationId: addDeviceToPool
      requestBody: {$ref: "#/components/requestBodies/PoolDeviceInput"}
      responses:
        "200": {$ref: "#/components/responses/PoolMembershipSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      tags: [Pools]
      operationId: removeDeviceFromPool
      requestBody: {$ref: "#/components/requestBodies/PoolDeviceInput"}
      responses:
        "200": {$ref: "#/components/responses/PoolMembershipSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-pools/{id}/images:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    get:
      tags: [Pools]
      operationId: listDevicePoolImages
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {$ref: "#/components/responses/PoolImageListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-pools/{id}/images/{image_id}:
    parameters:
      - {$ref: "#/components/parameters/ResourceID"}
      - {name: image_id, in: path, required: true, schema: {$ref: "#/components/schemas/Identifier"}}
    put:
      tags: [Pools]
      operationId: setDevicePoolImageTarget
      requestBody: {$ref: "#/components/requestBodies/DevicePoolImageInput"}
      responses:
        "200": {$ref: "#/components/responses/PoolImageSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      tags: [Pools]
      operationId: disableDevicePoolImageTarget
      responses:
        "200": {$ref: "#/components/responses/PoolImageSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
        - {name: pool_id, in: query, schema: {$ref: "#/components/schemas/Identifier"}}
        - {name: lifecycle_status, in: query, schema: {$ref: "#/components/schemas/DeviceLifecycleStatus"}}
        - {name: health_status, in: query, schema: {$ref: "#/components/schemas/HealthStatus"}}
      responses:
        "200": {$ref: "#/components/responses/DeviceListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/devices/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    get:
      tags: [Devices]
      operationId: getDevice
      parameters:
        - {$ref: "#/components/parameters/EvalRunID"}
        - {$ref: "#/components/parameters/EvalAttemptID"}
        - {$ref: "#/components/parameters/Traceparent"}
      responses:
        "200": {$ref: "#/components/responses/DeviceSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/devices/{id}/restarts:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Devices]
      operationId: restartDevice
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/ActorID"}
      requestBody: {$ref: "#/components/requestBodies/OperationReason"}
      responses:
        "202": {$ref: "#/components/responses/DeviceAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/devices/{id}/rebuilds:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Devices]
      operationId: rebuildDevice
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/ActorID"}
      requestBody: {$ref: "#/components/requestBodies/OperationReason"}
      responses:
        "202": {$ref: "#/components/responses/DeviceAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/devices/{id}/quarantines:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Devices]
      operationId: quarantineDevice
      parameters: [{$ref: "#/components/parameters/ActorID"}]
      requestBody: {$ref: "#/components/requestBodies/OperationReason"}
      responses:
        "200": {$ref: "#/components/responses/DeviceSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      tags: [Devices]
      operationId: unquarantineDevice
      parameters: [{$ref: "#/components/parameters/ActorID"}]
      requestBody: {$ref: "#/components/requestBodies/OperationReason"}
      responses:
        "200": {$ref: "#/components/responses/DeviceSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/devices/{id}/health-events:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    get:
      tags: [Devices]
      operationId: listDeviceHealthEvents
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {$ref: "#/components/responses/HealthEventListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/device-reservations:
    get:
      tags: [Reservations]
      operationId: listDeviceReservations
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
        - {name: owner_type, in: query, schema: {$ref: "#/components/schemas/OwnerType"}}
        - {name: owner_id, in: query, schema: {$ref: "#/components/schemas/OwnerID"}}
      responses:
        "200": {$ref: "#/components/responses/ReservationListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [Reservations]
      operationId: createDeviceReservation
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/EvalRunID"}
        - {$ref: "#/components/parameters/EvalAttemptID"}
        - {$ref: "#/components/parameters/Traceparent"}
      requestBody: {$ref: "#/components/requestBodies/ReservationCreate"}
      responses:
        "201": {$ref: "#/components/responses/ReservationCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/device-reservations/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    get:
      tags: [Reservations]
      operationId: getDeviceReservation
      parameters:
        - {$ref: "#/components/parameters/EvalRunID"}
        - {$ref: "#/components/parameters/EvalAttemptID"}
        - {$ref: "#/components/parameters/Traceparent"}
      responses:
        "200": {$ref: "#/components/responses/ReservationSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/device-reservations/{id}/extensions:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Reservations]
      operationId: extendDeviceReservation
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/EvalRunID"}
        - {$ref: "#/components/parameters/EvalAttemptID"}
        - {$ref: "#/components/parameters/Traceparent"}
      requestBody: {$ref: "#/components/requestBodies/LeaseExtension"}
      responses:
        "200": {$ref: "#/components/responses/ReservationSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/device-reservations/{id}/releases:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Reservations]
      operationId: releaseDeviceReservation
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/EvalRunID"}
        - {$ref: "#/components/parameters/EvalAttemptID"}
        - {$ref: "#/components/parameters/Traceparent"}
      requestBody: {$ref: "#/components/requestBodies/ReservationRelease"}
      responses:
        "200": {$ref: "#/components/responses/ReservationSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "502": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/device-reservations/{id}/remote-sessions:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Reservations]
      operationId: createRemoteSession
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/RemoteSessionCreate"}
      responses:
        "201": {$ref: "#/components/responses/RemoteSessionCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/device-audit-events:
    get:
      tags: [Audit]
      operationId: listDeviceAuditEvents
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {$ref: "#/components/responses/AuditEventListSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /console/api/v1/sessions:
    post:
      tags: [Console]
      operationId: createConsoleSession
      security: []
      requestBody: {$ref: "#/components/requestBodies/ConsoleLogin"}
      responses:
        "201": {$ref: "#/components/responses/ConsoleSessionCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/ServerError"}
  /console/api/v1/me:
    get:
      tags: [Console]
      operationId: getConsoleSession
      security: [{consoleCookie: []}]
      responses:
        "200": {$ref: "#/components/responses/ConsoleSessionSuccess"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /console/api/v1/sessions/current:
    delete:
      tags: [Console]
      operationId: deleteConsoleSession
      security: [{consoleCookie: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200": {$ref: "#/components/responses/ConsoleLogoutSuccess"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /internal/v1/device-hosts/{id}/heartbeats:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Agent]
      operationId: heartbeatDeviceHost
      security: [{agentBearer: []}]
      requestBody: {$ref: "#/components/requestBodies/HostHeartbeat"}
      responses: &standardResponses
        "200": {$ref: "#/components/responses/Success"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /internal/v1/device-hosts/{id}/commands/claims:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Agent]
      operationId: claimHostCommands
      security: [{agentBearer: []}]
      requestBody: {$ref: "#/components/requestBodies/CommandClaim"}
      responses: *standardResponses
  /internal/v1/device-host-commands/{id}/completions:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Agent]
      operationId: completeHostCommand
      security: [{agentBearer: []}]
      requestBody: {$ref: "#/components/requestBodies/CommandCompletion"}
      responses: *standardResponses
  /internal/v1/devices/{id}/health-events:
    parameters: [{$ref: "#/components/parameters/ResourceID"}]
    post:
      tags: [Agent]
      operationId: reportDeviceHealth
      security: [{agentBearer: []}]
      requestBody: {$ref: "#/components/requestBodies/HealthEvent"}
      responses: &createdResponses
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: 新版 Alcor Worker、DaFit Harness 或受控管理服务使用。
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-token
      description: 只允许 Host Agent 调用 internal API。
    consoleCookie:
      type: apiKey
      in: cookie
      name: device_farm_session
      description: Device Farm Console 同源短时会话；写请求还必须携带 X-CSRF-Token。
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Identifier"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    ActorID:
      name: X-Device-Farm-Actor-Id
      in: header
      required: false
      description: Alcor Adapter 注入的平台操作者标识；缺省时记录认证服务身份。不得放入 Token、密码或 Cookie。
      schema: {type: string, minLength: 1, maxLength: 128}
    EvalRunID:
      name: X-Eval-Run-Id
      in: header
      required: false
      description: 新版 Alcor Run UUID/ULID；RunAttempt Adapter 调用时必传。
      schema: {$ref: "#/components/schemas/Identifier"}
    EvalAttemptID:
      name: X-Eval-Attempt-Id
      in: header
      required: false
      description: 新版 Alcor RunAttempt UUID/ULID；owner_type=run_attempt 时必须与 owner_id 一致。
      schema: {$ref: "#/components/schemas/Identifier"}
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context，设备农场原样透传，不作为业务主键。
      schema: {type: string, minLength: 1, maxLength: 128}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 128}
  requestBodies:
    DeviceImageInput:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DeviceImageInput"}
          example: {name: android-16-x86_64, docker_image: "registry.example/alcor/android-emulator:api36-2026.08", docker_digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", api_level: 36, abi: x86_64, resolution: 1080x2400, resource_config: {cpu: 2, memory_mb: 4096}}
    DeviceHostInput:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DeviceHostInput"}
          example: {name: kvm-host-01, host_type: docker_emulator, capacity: {cpu: 16, memory_mb: 32768, device_slots: 8}}
    DevicePoolInput:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DevicePoolInput"}
          example: {name: android-smoke, default_lease_seconds: 1800, max_lease_seconds: 7200, max_concurrency: 2, enabled: true}
    DevicePoolImageInput:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DevicePoolImageInput"}
          example: {min_ready: 2, max_instances: 2, enabled: true}
    PoolDeviceInput:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PoolDeviceInput"}
    ReservationCreate:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ReservationCreate"}
          example: {pool_id: "01JDEVICEPOOL0000000000000", owner_type: test_run, owner_id: "01JTESTATTEMPT000000000000", requested_capabilities: {platformName: Android, apiLevel: 34}, lease_seconds: 1800}
    LeaseExtension:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LeaseExtension"}
    ReservationRelease:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ReservationRelease"}
    RemoteSessionCreate:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RemoteSessionCreate"}
    OperationReason:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OperationReason"}
    HostHeartbeat:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/HostHeartbeat"}
    CommandClaim:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CommandClaim"}
    CommandCompletion:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CommandCompletion"}
    HealthEvent:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/HealthEvent"}
    ConsoleLogin:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ConsoleLogin"}
  responses:
    ImageListSuccess:
      description: 镜像分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/ImageListEnvelope"}}}
    ImageSuccess:
      description: 镜像操作成功
      content: {application/json: {schema: {$ref: "#/components/schemas/ImageEnvelope"}}}
    ImageCreated:
      description: 镜像已创建
      content: {application/json: {schema: {$ref: "#/components/schemas/ImageEnvelope"}}}
    ImageAccepted:
      description: 镜像验证已接受
      content: {application/json: {schema: {$ref: "#/components/schemas/ImageEnvelope"}}}
    HostListSuccess:
      description: Host 分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/HostListEnvelope"}}}
    HostSuccess:
      description: Host 操作成功
      content: {application/json: {schema: {$ref: "#/components/schemas/HostEnvelope"}}}
    HostCreated:
      description: Host 已创建
      content: {application/json: {schema: {$ref: "#/components/schemas/HostEnvelope"}}}
    PoolListSuccess:
      description: Pool 分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/PoolListEnvelope"}}}
    PoolSuccess:
      description: Pool 操作成功
      content: {application/json: {schema: {$ref: "#/components/schemas/PoolEnvelope"}}}
    PoolCreated:
      description: Pool 已创建
      content: {application/json: {schema: {$ref: "#/components/schemas/PoolEnvelope"}}}
    PoolImageListSuccess:
      description: Pool 镜像目标分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/PoolImageListEnvelope"}}}
    PoolImageSuccess:
      description: Pool 镜像目标操作成功
      content: {application/json: {schema: {$ref: "#/components/schemas/PoolImageEnvelope"}}}
    PoolMembershipSuccess:
      description: Pool 设备成员操作成功
      content: {application/json: {schema: {$ref: "#/components/schemas/PoolMembershipEnvelope"}}}
    DeviceListSuccess:
      description: 设备分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/DeviceListEnvelope"}}}
    DeviceAccepted:
      description: 设备异步操作已接受
      content: {application/json: {schema: {$ref: "#/components/schemas/DeviceEnvelope"}}}
    ReservationListSuccess:
      description: 预约分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/ReservationListEnvelope"}}}
    RemoteSessionCreated:
      description: STF 短时入口已创建
      content: {application/json: {schema: {$ref: "#/components/schemas/RemoteSessionEnvelope"}}}
    AuditEventListSuccess:
      description: 设备域审计分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/AuditEventListEnvelope"}}}
    HealthEventListSuccess:
      description: 设备健康事件分页列表
      content: {application/json: {schema: {$ref: "#/components/schemas/HealthEventListEnvelope"}}}
    ConsoleSessionCreated:
      description: Console 会话已创建并设置 Cookie
      content: {application/json: {schema: {$ref: "#/components/schemas/ConsoleSessionEnvelope"}}}
    ConsoleSessionSuccess:
      description: 当前 Console 会话
      content: {application/json: {schema: {$ref: "#/components/schemas/ConsoleSessionEnvelope"}}}
    ConsoleLogoutSuccess:
      description: 当前 Console 会话已撤销
      content: {application/json: {schema: {$ref: "#/components/schemas/ConsoleLogoutEnvelope"}}}
    ReservationCreated:
      description: 预约已创建，初始通常为 pending
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ReservationEnvelope"}
    ReservationSuccess:
      description: 预约操作成功
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ReservationEnvelope"}
    DeviceSuccess:
      description: 已分配设备及连接信息
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DeviceEnvelope"}
    Success:
      description: 请求成功
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SuccessEnvelope"}
    Created:
      description: 资源已创建
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SuccessEnvelope"}
    Accepted:
      description: 异步操作已接受
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SuccessEnvelope"}
    BadRequest: {$ref: "#/components/responses/Error"}
    Unauthorized:
      description: 缺少或提供了无效 Token
      headers:
        WWW-Authenticate: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: 身份无权访问该接口域
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound: {$ref: "#/components/responses/Error"}
    Conflict: {$ref: "#/components/responses/Error"}
    Error:
      description: 请求失败
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    ServerError:
      description: 服务或基础设施异常
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Identifier:
      type: string
      minLength: 16
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      description: UUID 或 ULID 字符串，不接受旧整数任务 ID。
    SuccessEnvelope:
      type: object
      required: [request_id, data, error]
      properties:
        request_id: {type: string}
        data: {type: object, additionalProperties: true}
        error: {nullable: true}
    ErrorEnvelope:
      type: object
      required: [request_id, data, error]
      properties:
        request_id: {type: string}
        data: {nullable: true}
        error: {$ref: "#/components/schemas/APIError"}
    APIError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
          x-adapter-stable-codes: [INVALID_ARGUMENT, INVALID_STATE_TRANSITION, DEVICE_POOL_UNAVAILABLE, DEVICE_CAPACITY_UNAVAILABLE, HOST_OFFLINE, AGENT_COMMAND_TIMEOUT, EMULATOR_CREATE_FAILED, EMULATOR_START_FAILED, EMULATOR_DELETE_FAILED, KVM_UNAVAILABLE, STF_CLAIM_FAILED, STF_RELEASE_FAILED, STF_REMOTE_CONNECT_FAILED, STF_REMOTE_DISCONNECT_FAILED, STF_BAD_RESPONSE, APPIUM_UNHEALTHY, DEVICE_BOOT_TIMEOUT, DEVICE_QUARANTINED, RESERVATION_EXPIRED, LEASE_EXTENSION_REJECTED, SERVICE_UNAVAILABLE, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
        message: {type: string}
        details: {type: object, additionalProperties: true}
        retryable: {type: boolean}
    DeviceImage:
      type: object
      additionalProperties: false
      required: [id, name, docker_digest, api_level, abi, resolution, resource_config, status, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        name: {type: string}
        docker_image: {type: string}
        docker_digest: {type: string}
        api_level: {type: integer}
        abi: {type: string}
        resolution: {type: string}
        resource_config: {type: object, additionalProperties: true}
        status: {type: string, enum: [draft, validating, ready, failed, disabled]}
        validation_error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DeviceHost:
      type: object
      additionalProperties: false
      required: [id, name, host_type, capabilities, capacity, used_capacity, status, draining, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        name: {type: string}
        host_type: {type: string, enum: [docker_emulator, usb_android, hybrid]}
        address: {type: string}
        capabilities: {type: object, additionalProperties: true}
        capacity: {type: object, additionalProperties: true}
        used_capacity: {type: object, additionalProperties: true}
        status: {type: string, enum: [online, offline, draining, maintenance]}
        draining: {type: boolean}
        last_heartbeat_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DevicePool:
      type: object
      additionalProperties: false
      required: [id, name, default_lease_seconds, max_lease_seconds, max_concurrency, status, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        name: {type: string}
        default_lease_seconds: {type: integer}
        max_lease_seconds: {type: integer}
        max_concurrency: {type: integer}
        status: {type: string, enum: [active, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DevicePoolImage:
      type: object
      additionalProperties: false
      required: [pool_id, image_id, min_ready, max_instances, enabled, created_at, updated_at]
      properties:
        pool_id: {$ref: "#/components/schemas/Identifier"}
        image_id: {$ref: "#/components/schemas/Identifier"}
        min_ready: {type: integer}
        max_instances: {type: integer}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PoolMembership:
      type: object
      additionalProperties: false
      required: [pool_id, device_id, enabled]
      properties:
        pool_id: {$ref: "#/components/schemas/Identifier"}
        device_id: {$ref: "#/components/schemas/Identifier"}
        enabled: {type: boolean}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor_type, actor_id, action, resource_type, resource_id, request_id, summary, created_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        actor_type: {type: string, enum: [service, agent, system, console]}
        actor_id: {type: string}
        action: {type: string}
        resource_type: {type: string}
        resource_id: {type: string}
        request_id: {type: string}
        reason: {type: string}
        summary: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    HealthEventRecord:
      type: object
      additionalProperties: false
      required: [id, device_id, source, event_type, severity, reason, payload, observed_at, created_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        device_id: {$ref: "#/components/schemas/Identifier"}
        source: {type: string, enum: [agent, provider, adb, appium, stf, reconciler]}
        event_type: {type: string}
        severity: {type: string, enum: [info, warning, error, critical]}
        reason: {type: string}
        payload: {type: object, additionalProperties: true}
        observed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    RemoteSession:
      type: object
      additionalProperties: false
      required: [id, reservation_id, expires_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        reservation_id: {$ref: "#/components/schemas/Identifier"}
        remote_connect_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
    ConsoleRole:
      type: string
      enum: [viewer, operator, admin]
    ConsoleUser:
      type: object
      additionalProperties: false
      required: [id, display_name, role]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        display_name: {type: string, minLength: 1, maxLength: 128}
        role: {$ref: "#/components/schemas/ConsoleRole"}
    ConsoleSession:
      type: object
      additionalProperties: false
      required: [user, expires_at]
      properties:
        user: {$ref: "#/components/schemas/ConsoleUser"}
        expires_at: {type: string, format: date-time}
    ConsoleLogin:
      type: object
      additionalProperties: false
      required: [user_id, password]
      properties:
        user_id: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 1024, format: password}
    PageMetadata:
      type: object
      required: [page, page_size, total]
      properties:
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 200}
        total: {type: integer, minimum: 0}
    DeviceImagePage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/DeviceImage"}}}}
    DeviceHostPage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/DeviceHost"}}}}
    DevicePoolPage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/DevicePool"}}}}
    DevicePoolImagePage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/DevicePoolImage"}}}}
    DevicePage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Device"}}}}
    ReservationPage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Reservation"}}}}
    AuditEventPage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}}}
    HealthEventPage:
      allOf:
        - {$ref: "#/components/schemas/PageMetadata"}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/HealthEventRecord"}}}}
    ImageEnvelope: {$ref: "#/components/schemas/DeviceImageEnvelope"}
    DeviceImageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DeviceImage"}, error: {nullable: true}}
    ImageListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DeviceImagePage"}, error: {nullable: true}}
    HostEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DeviceHost"}, error: {nullable: true}}
    HostListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DeviceHostPage"}, error: {nullable: true}}
    PoolEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DevicePool"}, error: {nullable: true}}
    PoolListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DevicePoolPage"}, error: {nullable: true}}
    PoolImageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DevicePoolImage"}, error: {nullable: true}}
    PoolImageListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DevicePoolImagePage"}, error: {nullable: true}}
    PoolMembershipEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/PoolMembership"}, error: {nullable: true}}
    DeviceListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/DevicePage"}, error: {nullable: true}}
    ReservationListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/ReservationPage"}, error: {nullable: true}}
    RemoteSessionEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/RemoteSession"}, error: {nullable: true}}
    AuditEventListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/AuditEventPage"}, error: {nullable: true}}
    HealthEventListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/HealthEventPage"}, error: {nullable: true}}
    ConsoleSessionEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties: {request_id: {type: string}, data: {$ref: "#/components/schemas/ConsoleSession"}, error: {nullable: true}}
    ConsoleLogoutEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties:
        request_id: {type: string}
        data: {type: object, additionalProperties: false, required: [revoked], properties: {revoked: {type: boolean}}}
        error: {nullable: true}
    DeviceImageInput:
      type: object
      additionalProperties: false
      required: [name, docker_digest, api_level, abi, resolution, resource_config]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        docker_image:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^[A-Za-z0-9._:/@-]+$"
          description: Required before validation; use an explicit version tag or immutable digest reference.
        docker_digest: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        api_level: {type: integer, minimum: 21}
        abi: {type: string, enum: [x86_64, arm64-v8a]}
        resolution: {type: string, pattern: "^[0-9]+x[0-9]+$"}
        resource_config: {type: object, additionalProperties: true}
        enabled: {type: boolean, default: true}
    DeviceHostInput:
      type: object
      additionalProperties: false
      required: [name, host_type, capacity]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        host_type: {type: string, enum: [docker_emulator, usb_android, hybrid]}
        address: {type: string, maxLength: 255}
        capabilities: {type: object, additionalProperties: true}
        capacity: {$ref: "#/components/schemas/HostCapacity"}
    HostCapacity:
      type: object
      required: [cpu, memory_mb, device_slots]
      properties:
        cpu: {type: integer, minimum: 1}
        memory_mb: {type: integer, minimum: 1024}
        device_slots: {type: integer, minimum: 1}
    DevicePoolInput:
      type: object
      additionalProperties: false
      required: [name, default_lease_seconds, max_lease_seconds, max_concurrency]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        default_lease_seconds: {type: integer, minimum: 60}
        max_lease_seconds: {type: integer, minimum: 60}
        max_concurrency: {type: integer, minimum: 1}
        enabled: {type: boolean, default: true}
    DevicePoolImageInput:
      type: object
      additionalProperties: false
      required: [min_ready, max_instances, enabled]
      properties:
        min_ready: {type: integer, minimum: 0}
        max_instances: {type: integer, minimum: 1}
        enabled: {type: boolean}
    PoolDeviceInput:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id: {$ref: "#/components/schemas/Identifier"}
    OwnerType:
      type: string
      enum: [run_attempt, manual, test_run]
    OwnerID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_.@-]+$"
    ReservationStatus:
      type: string
      enum: [pending, active, released, force_released, expired, failed]
    Reservation:
      type: object
      additionalProperties: false
      required: [id, pool_id, owner_type, owner_id, requested_capabilities, lease_seconds, status, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        pool_id: {$ref: "#/components/schemas/Identifier"}
        device_id: {$ref: "#/components/schemas/Identifier"}
        owner_type: {$ref: "#/components/schemas/OwnerType"}
        owner_id: {$ref: "#/components/schemas/OwnerID"}
        requested_capabilities: {type: object, additionalProperties: true}
        lease_seconds: {type: integer, minimum: 60}
        status: {$ref: "#/components/schemas/ReservationStatus"}
        starts_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        released_at: {type: string, format: date-time}
        failure_code: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Device:
      type: object
      additionalProperties: false
      required: [id, host_id, device_kind, provider_type, provider_ref, lifecycle_mode, serial, capabilities, lifecycle_status, health_status, consecutive_failures, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/Identifier"}
        host_id: {$ref: "#/components/schemas/Identifier"}
        image_id: {$ref: "#/components/schemas/Identifier"}
        device_kind: {type: string, enum: [emulator, physical]}
        provider_type: {type: string, enum: [docker_emulator, usb_android, mock]}
        provider_ref: {type: string}
        lifecycle_mode: {type: string, enum: [rebuild, clean, factory_reset]}
        serial: {type: string, minLength: 1}
        stf_serial: {type: string}
        adb_endpoint: {type: string}
        appium_endpoint: {type: string, format: uri}
        capabilities:
          type: object
          additionalProperties: true
          description: appiumUdid 存放 Appium 所在网络空间使用的 UDID；缺省时 Adapter 回退 serial。
        lifecycle_status: {$ref: "#/components/schemas/DeviceLifecycleStatus"}
        health_status: {$ref: "#/components/schemas/HealthStatus"}
        health_reason: {type: string}
        consecutive_failures: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReservationEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties:
        request_id: {type: string}
        data: {$ref: "#/components/schemas/Reservation"}
        error: {nullable: true}
    DeviceEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error]
      properties:
        request_id: {type: string}
        data: {$ref: "#/components/schemas/Device"}
        error: {nullable: true}
    ReservationCreate:
      type: object
      additionalProperties: false
      required: [pool_id, owner_type, owner_id, lease_seconds]
      properties:
        pool_id: {$ref: "#/components/schemas/Identifier"}
        owner_type: {$ref: "#/components/schemas/OwnerType"}
        owner_id: {$ref: "#/components/schemas/OwnerID"}
        requested_capabilities: {type: object, additionalProperties: true}
        lease_seconds: {type: integer, minimum: 60}
    LeaseExtension:
      type: object
      additionalProperties: false
      required: [additional_seconds]
      properties:
        additional_seconds: {type: integer, minimum: 60}
    ReservationRelease:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: 必填操作原因；包含 Token、密码、Cookie、密钥或带口令 DSN 时拒绝请求。
        force: {type: boolean, default: false}
    RemoteSessionCreate:
      type: object
      additionalProperties: false
      required: [owner_type, owner_id]
      properties:
        owner_type: {$ref: "#/components/schemas/OwnerType"}
        owner_id: {$ref: "#/components/schemas/OwnerID"}
        ttl_seconds: {type: integer, minimum: 30, maximum: 3600, default: 300}
    OperationReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: 必填操作原因；包含 Token、密码、Cookie、密钥或带口令 DSN 时拒绝请求。
    HostHeartbeat:
      type: object
      additionalProperties: false
      required: [agent_time, capacity, devices]
      properties:
        agent_time: {type: string, format: date-time}
        capacity: {$ref: "#/components/schemas/HostCapacity"}
        environment: {type: object, additionalProperties: true}
        devices: {type: array, items: {$ref: "#/components/schemas/DiscoveredDevice"}}
    DiscoveredDevice:
      type: object
      required: [provider_ref, serial, lifecycle_status, health_status]
      properties:
        provider_ref: {type: string}
        serial: {type: string}
        lifecycle_status: {$ref: "#/components/schemas/DeviceLifecycleStatus"}
        health_status: {$ref: "#/components/schemas/HealthStatus"}
        connection:
          type: object
          additionalProperties: false
          properties:
            adb_endpoint: {type: string}
            appium_endpoint: {type: string, format: uri}
            appium_udid: {type: string}
    CommandClaim:
      type: object
      additionalProperties: false
      required: [lease_seconds, max_commands]
      properties:
        lease_seconds: {type: integer, minimum: 5, maximum: 300}
        max_commands: {type: integer, minimum: 1, maximum: 20}
        wait_seconds: {type: integer, minimum: 0, maximum: 30, default: 20}
    CommandCompletion:
      type: object
      additionalProperties: false
      required: [lease_token, attempt, status]
      properties:
        lease_token: {type: string, minLength: 16}
        attempt: {type: integer, minimum: 1}
        status: {type: string, enum: [succeeded, failed, timed_out]}
        result: {type: object, additionalProperties: true}
        error: {$ref: "#/components/schemas/APIError"}
    HealthEvent:
      type: object
      additionalProperties: false
      required: [source, event_type, severity, reason, observed_at]
      properties:
        source: {type: string, enum: [agent, provider, adb, appium, stf]}
        event_type: {type: string}
        severity: {type: string, enum: [info, warning, error, critical]}
        reason: {type: string}
        observed_at: {type: string, format: date-time}
        payload: {type: object, additionalProperties: true}
    DeviceLifecycleStatus:
      type: string
      enum: [provisioning, booting, ready, reserved, busy, recycling, stopped, quarantined, deleted]
    HealthStatus:
      type: string
      enum: [unknown, healthy, degraded, unhealthy]
