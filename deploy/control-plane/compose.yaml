name: alcor-device-farm-control-plane

services:
  postgres:
    image: ${DEVICE_FARM_POSTGRES_IMAGE:-postgres:17.5-alpine}
    environment:
      POSTGRES_DB: ${DEVICE_FARM_POSTGRES_DB:?set DEVICE_FARM_POSTGRES_DB}
      POSTGRES_USER: ${DEVICE_FARM_POSTGRES_USER:?set DEVICE_FARM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEVICE_FARM_POSTGRES_PASSWORD:?set DEVICE_FARM_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    mem_limit: ${DEVICE_FARM_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${DEVICE_FARM_POSTGRES_CPUS:-1.5}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  device-farm-server:
    build:
      context: ./source
      dockerfile: Dockerfile
      args:
        VERSION: ${DEVICE_FARM_VERSION:?set DEVICE_FARM_VERSION}
        COMMIT: ${DEVICE_FARM_COMMIT:?set DEVICE_FARM_COMMIT}
        BUILD_DATE: ${DEVICE_FARM_BUILD_DATE:?set DEVICE_FARM_BUILD_DATE}
    image: alcor-device-farm:${DEVICE_FARM_VERSION}
    env_file:
      - ./server.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets/device-farm:ro
      - ./backups:/var/backups/device-farm
    environment:
      DEVICE_FARM_SERVER_ADDRESS: 0.0.0.0:8080
      DEVICE_FARM_SERVER_BINARY: /usr/local/bin/device-farm-server
      DEVICE_FARM_SERVER_CONFIG: ""
    expose:
      - "8080"
    ports:
      - "${DEVICE_FARM_BIND_ADDRESS:-127.0.0.1}:${DEVICE_FARM_IOS_GATEWAY_PORT:-18181}:8081"
      - "${DEVICE_FARM_BIND_ADDRESS:-127.0.0.1}:${DEVICE_FARM_AGENT_HTTP_PORT:-18182}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: ${DEVICE_FARM_SERVER_MEMORY_LIMIT:-512m}
    cpus: ${DEVICE_FARM_SERVER_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  device-farm-gateway:
    image: ${DEVICE_FARM_GATEWAY_IMAGE:-nginx:1.29.1-alpine}
    user: "101:101"
    depends_on:
      device-farm-server:
        condition: service_healthy
    ports:
      - "${DEVICE_FARM_BIND_ADDRESS:-127.0.0.1}:${DEVICE_FARM_HTTP_PORT:-18180}:8443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls.crt:/run/secrets/device-farm/tls.crt:ro
      - ./secrets/tls.key:/run/secrets/device-farm/tls.key:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: ${DEVICE_FARM_GATEWAY_MEMORY_LIMIT:-64m}
    cpus: ${DEVICE_FARM_GATEWAY_CPUS:-0.25}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://device-farm-server:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
