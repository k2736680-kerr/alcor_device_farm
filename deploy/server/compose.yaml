services:
  device-farm-server:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${DEVICE_FARM_VERSION:?set DEVICE_FARM_VERSION}
        COMMIT: ${DEVICE_FARM_COMMIT:?set DEVICE_FARM_COMMIT}
        BUILD_DATE: ${DEVICE_FARM_BUILD_DATE:?set DEVICE_FARM_BUILD_DATE}
    image: alcor-device-farm:${DEVICE_FARM_VERSION}
    env_file:
      - server.env
    volumes:
      - ./secrets:/run/secrets/device-farm:ro
    environment:
      DEVICE_FARM_SERVER_ADDRESS: 0.0.0.0:8080
      DEVICE_FARM_SERVER_BINARY: /usr/local/bin/device-farm-server
      DEVICE_FARM_SERVER_CONFIG: ""
    ports:
      - "${DEVICE_FARM_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${DEVICE_FARM_BIND_ADDRESS:-127.0.0.1}:18081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
